name: CD

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # PASO CLAVE: Convertir el nombre del repo a minúsculas
      - name: Convertir nombre a minúsculas
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Subimos DOS etiquetas: el SHA (como pide el examen) y latest (para Coolify)
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Disparar despliegue en Coolify
        run: |
          curl --fail --silent --show-error --request POST \
            '${{ secrets.COOLIFY_WEBHOOK }}' \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Esperar a que el despliegue se estabilice
        run: sleep 30 # Aumenté a 30 segundos para darle tiempo a Coolify a descargar y reiniciar

      - name: Verificar /health tras el despliegue
        run: curl --fail --silent --show-error "${{ secrets.APP_URL }}/health"

      - name: Verificar /libros tras el despliegue
        run: curl --fail --silent --show-error "${{ secrets.APP_URL }}/libros"
