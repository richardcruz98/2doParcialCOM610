name: CD

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de la imagen (tag = SHA del commit)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Disparar despliegue en Coolify
        run: |
          curl --fail --silent --show-error --request POST \
            '${{ secrets.COOLIFY_WEBHOOK }}' \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Esperar a que el despliegue se estabilice
        run: sleep 20

      - name: Verificar /health tras el despliegue
        run: curl --fail --silent --show-error "${{ secrets.APP_URL }}/health"

      - name: Verificar /libros tras el despliegue
        run: curl --fail --silent --show-error "${{ secrets.APP_URL }}/libros"
