name: CD

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/libros-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir tag con el SHA del commit
        id: vars
        run: echo "image_tag=${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.image_tag }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            IMAGE="${{ needs.build-and-push.outputs.image_tag }}"
            PREVIOUS_IMAGE=$(docker inspect --format '{{.Config.Image}}' libros-api 2>/dev/null || echo "")

            docker pull "$IMAGE"

            docker rm -f libros-api-candidate 2>/dev/null || true
            docker run -d --name libros-api-candidate \
              --env-file /home/${{ secrets.EC2_USER }}/libros-api.env \
              -p 3001:3000 \
              "$IMAGE"

            sleep 5
            if curl -fs http://127.0.0.1:3001/health > /dev/null; then
              echo "Health check OK, promoviendo nueva version"
              docker rm -f libros-api 2>/dev/null || true
              docker rm -f libros-api-candidate
              docker run -d --name libros-api \
                --env-file /home/${{ secrets.EC2_USER }}/libros-api.env \
                -p 3000:3000 \
                "$IMAGE"
            else
              echo "Health check fallo, se conserva la version anterior"
              docker rm -f libros-api-candidate
              exit 1
            fi

      - name: Verificar /health tras el despliegue
        run: |
          sleep 5
          curl -fs http://${{ secrets.EC2_HOST }}/health

      - name: Verificar /libros tras el despliegue
        run: curl -fs http://${{ secrets.EC2_HOST }}/libros
