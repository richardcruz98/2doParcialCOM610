name: CD

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # PASO CLAVE: Convertir el nombre del repo a minúsculas
      - name: Convertir nombre a minúsculas
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Subimos DOS etiquetas: el SHA (como pide el examen) y latest (para Coolify)
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Disparar despliegue en Coolify
        run: |
          # Guardamos la respuesta y el código HTTP
          RESPONSE=$(curl -s -w "\n%{http_code}" --request POST \
            '${{ secrets.COOLIFY_WEBHOOK }}' \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Coolify respondió con HTTP: $HTTP_CODE"
          echo "Mensaje: $BODY"

          if [ "$HTTP_CODE" -ne 200 ] && [ "$HTTP_CODE" -ne 201 ]; then
            echo "Error al disparar el despliegue en Coolify."
            exit 1
          fi

      - name: Esperar a que el despliegue se estabilice
        run: sleep 40 # Aumenté a 40 segundos por seguridad

      - name: Verificar /health tras el despliegue
        run: curl --fail --silent --show-error "${{ secrets.APP_URL }}/health"

      - name: Verificar /libros tras el despliegue
        run: curl --fail --silent --show-error "${{ secrets.APP_URL }}/libros"
